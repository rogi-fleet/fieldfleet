name: pro_room_scanner
description: Professional AR Room Scanner with CAD export
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # AR Core (Android) & ARKit (iOS)
  ar_flutter_plugin_2: ^0.0.3
  vector_math: ^2.1.4
  
  # Permissions & File Handling
  permission_handler: ^11.3.1
  path_provider: ^2.0.15
  
  # Export & Sharing
  share_plus: ^7.0.0
  pdf: ^3.10.4
  printing: ^5.11.0
  
  # ML for Room Detection
  google_mlkit_image_labeling: ^0.12.0
  camera: ^0.10.5
  
  # Voice Input
  speech_to_text: ^7.0.0
  
  # Excel Export
  csv: ^6.0.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  
  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true